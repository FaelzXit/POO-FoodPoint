<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodPoint</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <header>
        <h1>FoodPoint</h1>
        <p>Sistema de análise da produção</p>
    </header>

    <main class="painel">
        <h2>Pedidos cadastrados</h2>

        <form action="{{ url_for('cadastrar_pedido') }}" method="POST">
            <label for="tempo">Tempo (minutos):</label>
            <input type="number" id="tempo" name="tempo" min="0" required>

            <label for="etapa">Etapa da produção:</label>
            <select id="etapa" name="etapa" required>
                <option value="Separação">Separação</option>
                <option value="Preparo">Preparo</option>
                <option value="Finalização">Finalização</option>
                <option value="Entrega">Entrega</option>
            </select>

            <button type="submit">Cadastrar pedido</button>
        </form>

        {% if pedidos %}
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Tempo (minutos)</th>
                    <th>Etapa</th>
                    <th>Alterar etapa</th>
                    <th>Ações</th>
                </tr>
            </thead>


            <tbody>
                {% for pedido in pedidos %}
                <tr>
                    <td>{{ pedido[0] }}</td>
                    <td>{{ pedido[1] }}</td>
                    <td>{{ pedido[2] }}</td>

                    <td>
                        <form action="{{ url_for('alterar_etapa', id_pedido=pedido[0]) }}" method="POST">
                            <select name="etapa" required>
                                <option value="Separação">Separação</option>
                                <option value="Preparo">Preparo</option>
                                <option value="Finalização">Finalização</option>
                                <option value="Entrega">Entrega</option>
                            </select>

                            <button type="submit">Atualizar</button>
                        </form>
                    </td>

                    <td>
                        <form action="{{ url_for('excluir_pedido', id_pedido=pedido[0]) }}" method="POST">
                            <button type="submit">Excluir</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>

        </table>
        {% else %}
        <p class="vazio">Nenhum pedido cadastrado.</p>
        {% endif %}
    </main>
</body>

</html>
